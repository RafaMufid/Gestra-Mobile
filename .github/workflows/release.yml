name: Build & Release APK

on: 
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build & Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: |
          cd gestra
          flutter pub get

      - name: Patch flutter_tflite
        run: |
          FILE=$(find ~/.pub-cache -path "*flutter_tflite-1.0.1/android/build.gradle" | head -1)
          if [ -f "$FILE" ]; then
            sed -i '/android {/a\
                namespace "sq.flutter.tflite"' "$FILE"
          fi

      - name: Build APK
        run: |
          cd gestra
          flutter build apk --release

      - name: Create GitHub Release & Upload APK
        uses: softprops/action-gh-release@v2
        with:
          files: gestra/build/app/outputs/flutter-apk/app-release.apk
          name: Release ${{ github.ref_name }}
          tag_name: ${{ github.ref }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}